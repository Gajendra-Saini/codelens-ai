[project]
name = "codelens-ai"
version = "0.1.0"
description = "AI-powered codebase intelligence assistant"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sentence-transformers",
    "qdrant-client",
    "rank-bm25",
    "google-genai",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]